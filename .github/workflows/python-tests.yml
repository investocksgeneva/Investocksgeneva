name: hybrid_scanner tests

on:
  pull_request:
    paths:
      - "hybrid_scanner/**"
      - ".github/workflows/python-tests.yml"
  push:
    branches: [main]
    paths:
      - "hybrid_scanner/**"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python }}${{ matrix.min && ', minimum deps' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest dependencies on current Python.
          - python: "3.13"
          - python: "3.12"
          # Oldest versions requirements.txt allows, so the lower bounds stay honest.
          - python: "3.11"
            min: true
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: hybrid_scanner/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.min }}" = "true" ]; then
            pip install "pandas==2.2.*" "numpy==1.26.*" "pydantic==2.6.*" "matplotlib==3.8.*" "pytest==8.*"
          else
            pip install -r hybrid_scanner/requirements.txt
          fi

      - name: Lint
        if: ${{ !matrix.min }}
        run: |
          pip install ruff
          ruff check hybrid_scanner --select F,E,W,B --ignore E501,B905

      # FutureWarning as error: pandas deprecations fail here first,
      # not silently in a later release.
      - name: Run tests
        run: python -m pytest hybrid_scanner/tests -q -W error::FutureWarning
