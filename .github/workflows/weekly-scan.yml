name: Weekly hybrid scan

# Manual-only: runs the scanner on real Yahoo data and posts the signals to
# Discord. Start it from Actions → Weekly hybrid scan → Run workflow.
#
# The daily scan now runs locally on a Mac (hybrid_scanner/mac/), so the
# Friday schedule is switched off. To turn it back on, restore under `on:`
#   schedule:
#     - cron: "23 22 * * 5"   # Fridays 22:23 UTC, after the US close
#
# Posting needs a repository secret DISCORD_WEBHOOK_URL (Settings → Secrets
# and variables → Actions); a dry run doesn't.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Space-separated tickers (blank = S&P 500)"
        required: false
        default: ""
      alert_window:
        description: "Report signals from the last N daily bars"
        required: false
        default: "5"
      dry_run:
        description: "Dry run: log the Discord payload instead of posting"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      # Inputs are passed through env, never interpolated into the script,
      # so a crafted input can't inject shell commands.
      TICKERS: ${{ inputs.tickers }}
      ALERT_WINDOW: ${{ inputs.alert_window || '5' }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hybrid_scanner/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hybrid_scanner/requirements.txt

      - name: Check Discord webhook secret
        if: env.DRY_RUN != 'true'
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Repository secret DISCORD_WEBHOOK_URL is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Run scan and post to Discord
        run: |
          set -f  # no glob expansion of ticker input
          if [ -n "$TICKERS" ]; then universe=(--tickers $TICKERS); else universe=(--universe sp500); fi
          if [ "$DRY_RUN" = "true" ]; then live=(); else live=(--live-alerts); fi
          python -m hybrid_scanner.main "${universe[@]}" \
            --alert-window "$ALERT_WINDOW" --alert-title "Weekly hybrid scan" \
            --notify discord "${live[@]}" --export --plot

      - name: Upload signals, rejections and charts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weekly-scan-${{ github.run_id }}
          path: output/
          retention-days: 30
          if-no-files-found: ignore
